LE</text><text x="660" y="230" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">current state</text><text x="790" y="181" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">1st</text><rect x="750" y="185" width="80" height="58" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="790" y="222" text-anchor="middle" font-size="20" font-weight="800" fill="#2563eb" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">M0</text><line x1="832" y1="214" x2="858" y2="214" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#rk)"/><text x="900" y="181" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">2nd</text><rect x="860" y="185" width="80" height="58" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="900" y="222" text-anchor="middle" font-size="20" font-weight="800" fill="#16a34a" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">M1</text><line x1="942" y1="214" x2="968" y2="214" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#rk)"/><text x="1010" y="181" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">3rd</text><rect x="970" y="185" width="80" height="58" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/><text x="1010" y="222" text-anchor="middle" font-size="20" font-weight="800" fill="#ea580c" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">M2</text><rect x="600" y="273" width="120" height="58" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="660" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#2563eb" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">GNT_M0</text><text x="660" y="318" text-anchor="middle" font-size="11" fo