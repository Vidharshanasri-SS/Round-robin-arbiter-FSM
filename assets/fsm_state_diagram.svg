family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">g3</text><text x="550" y="716" text-anchor="middle" font-size="13" fill="#334155" font-family="Consolas, Menlo, monospace">gnt = 100</text><text x="550" y="733" text-anchor="middle" font-size="11" fill="#64748b" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">s = 11</text><rect x="40" y="760" width="400" height="130" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="56" y="786" text-anchor="start" font-size="14" font-weight="700" fill="#0f172a" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">How to read this diagram</text><text x="56" y="812" text-anchor="start" font-size="12.5" font-weight="400" fill="#334155" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">"Mx wins": IDLE picks the first requester in the order set by turn</text><text x="56" y="832" text-anchor="start" font-size="12.5" font-weight="400" fill="#334155" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">(see the priority table). Needs at least one request.</text><text x="56" y="856" text-anchor="start" font-size="12.5" font-weight="400" fill="#334155" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">Every grant ends by returning to IDLE, which also updates</text><text x="56" y="874" text-anchor="start" font-size="12.5" font-weight="400" fill="#334155" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">turn to point at the master after the one just served.</text></svg>