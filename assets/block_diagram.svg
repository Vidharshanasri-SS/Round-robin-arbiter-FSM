<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="b0" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="b1" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="b2" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="bk" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker></defs><rect width="1100" height="470" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="550" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">System Architecture</text><text x="550" y="64" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">Three masters compete for one shared resource; the arbiter FSM decides who owns it each cycle</text><rect x="40" y="96" width="170" height="68" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="125" y="136" text-anchor="middle" font-size="19" font-weight="700" fill="#2563eb" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">Master 0</text><line x1="210" y1="130" x2="425" y2="130" stroke="#2563eb" stroke-width="3" marker-end="url(#b0)"/><text x="318" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb" font-family="Consolas, Menlo, monospace">req[0]</text><line x1="735" y1="130" x2="905" y2="130" stroke="#2563eb" stroke-width="3" marker-end="url(#b0)"/><text x="820" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb" font-family="Consolas, Menlo, monospace">gnt[0]</text><rect x="40" y="196" width="170" height="68" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="125" y="236" text-anchor="middle" font-size="19" font-weight="700" fill="#16a34a" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">Master 1</text><line x1="210" y1="230" x2="425" y2="230" stroke="#16a34a" stroke-width="3" marker-end="url(#b1)"/><text x="318" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a" font-family="Consolas, Menlo, monospace">req[1]</text><line x1="735" y1="230" x2="905" y2="230" stroke="#16a34a" stroke-width="3" marker-end="url(#b1)"/><text x="820" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a" font-family="Consolas, Menlo, monospace">gnt[1]</text><rect x="40" y="296" width="170" height="68" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="125" y="336" text-anchor="middle" font-size="19" font-weight="700" fill="#ea580c" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">Master 2</text><line x1="210" y1="330" x2="425" y2="330" stroke="#ea580c" stroke-width="3" marker-end="url(#b2)"/><text x="318" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#ea580c" font-family="Consolas, Menlo, monospace">req[2]</text><line x1="735" y1="330" x2="905" y2="330" stroke="#ea580c" stroke-width="3" marker-end="url(#b2)"/><text x="820" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#ea580c" font-family="Consolas, Menlo, monospace">gnt[2]</text><rect x="430" y="95" width="300" height="275" rx="16" fill="#f8fafc" stroke="#0f172a" stroke-width="3.5"/><text x="580" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">Round Robin Arbiter</text><text x="580" y="148" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">Moore FSM · rotating priority</text><rect x="455" y="165" width="120" height="68" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/><text x="515" y="195" text-anchor="middle" font-size="16" font-weight="700" fill="#475569" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">IDLE</text><text x="515" y="215" text-anchor="middle" font-size="12" font-weight="400" fill="#475569" font-family="Consolas, Menlo, monospace">state = 00</text><rect x="585" y="165" width="120" height="68" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="645" y="195" text-anchor="middle" font-size="16" font-weight="700" fill="#2563eb" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">GNT_M0</text><text x="645" y="215" text-anchor="middle" font-size="12" font-weight="400" fill="#475569" font-family="Consolas, Menlo, monospace">state = 01</text><rect x="455" y="255" width="120" height="68" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="515" y="285" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">GNT_M1</text><text x="515" y="305" text-anchor="middle" font-size="12" font-weight="400" fill="#475569" font-family="Consolas, Menlo, monospace">state = 10</text><rect x="585" y="255" width="120" height="68" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/><text x="645" y="285" text-anchor="middle" font-size="16" font-weight="700" fill="#ea580c" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">GNT_M2</text><text x="645" y="305" text-anchor="middle" font-size="12" font-weight="400" fill="#475569" font-family="Consolas, Menlo, monospace">state = 11</text><text x="580" y="357" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">4 states = IDLE + 3 grant states</text><line x1="500" y1="80" x2="500" y2="95" stroke="#111827" stroke-width="3" marker-end="url(#bk)"/><line x1="660" y1="80" x2="660" y2="95" stroke="#111827" stroke-width="3" marker-end="url(#bk)"/><text x="500" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#111827" font-family="Consolas, Menlo, monospace">clk</text><text x="660" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#111827" font-family="Consolas, Menlo, monospace">rst_n</text><rect x="910" y="95" width="150" height="275" rx="16" fill="#f1f5f9" stroke="#475569" stroke-width="3"/><text x="985" y="215" text-anchor="middle" font-size="18" font-weight="700" fill="#334155" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">Shared</text><text x="985" y="238" text-anchor="middle" font-size="18" font-weight="700" fill="#334155" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">Resource</text><text x="985" y="265" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">bus / memory /</text><text x="985" y="282" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">peripheral</text><text x="550" y="425" text-anchor="middle" font-size="14" font-weight="400" fill="#334155" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">Exactly one gnt bit is high at a time (mutual exclusion). All three gnt bits are low in IDLE.</text><text x="550" y="447" text-anchor="middle" font-size="14" font-weight="400" fill="#334155" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">Priority rotates after every grant, so no master can starve the others.</text></svg>