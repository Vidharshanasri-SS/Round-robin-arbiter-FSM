<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 490" width="1100" height="490" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="b0" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="b1" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="b2" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="bk" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker></defs><rect width="1100" height="490" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="550" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">System Architecture</text><text x="550" y="64" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">Three masters compete for one shared resource; module rr_arbiter_fsm decides who owns it</text><rect x="40" y="101" width="170" height="68" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="125" y="141" text-anchor="middle" font-size="19" font-weight="700" fill="#2563eb" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">Master 0</text><line x1="210" y1="135" x2="425" y2="135" stroke="#2563eb" stroke-width="3" marker-end="url(#b0)"/><text x="318" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb" font-family="Consolas, Menlo, monospace">req[0]</text><line x1="735" y1="135" x2="905" y2="135" stroke="#2563eb" stroke-width="3" marker-end="url(#b0)"/><text x="820" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb" font-family="Consolas, Menlo, monospace">gnt[0]</text><rect x="40" y="201" width="170" height="68" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="125" y="241" text-anchor="middle" font-size="19" font-weight="700" fill="#16a34a" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">Master 1</text><line x1="210" y1="235" x2="425" y2="235" stroke="#16a34a" stroke-width="3" marker-end="url(#b1)"/><text x="318" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a" font-family="Consolas, Menlo, monospace">req[1]</text><line x1="735" y1="235" x2="905" y2="235" stroke="#16a34a" stroke-width="3" marker-end="url(#b1)"/><text x="820" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a" font-family="Consolas, Menlo, monospace">gnt[1]</text><rect x="40" y="301" width="170" height="68" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="125" y="341" text-anchor="middle" font-size="19" font-weight="700" fill="#ea580c" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">Master 2</text><line x1="210" y1="335" x2="425" y2="335" stroke="#ea580c" stroke-width="3" marker-end="url(#b2)"/><text x="318" y="325" text-anchor="middle" font-size="14" font-weight="700" fill="#ea580c" font-family="Consolas, Menlo, monospace">req[2]</text><line x1="735" y1="335" x2="905" y2="335" stroke="#ea580c" stroke-width="3" marker-end="url(#b2)"/><text x="820" y="325" text-anchor="middle" font-size="14" font-weight="700" fill="#ea580c" font-family="Consolas, Menlo, monospace">gnt[2]</text><rect x="430" y="100" width="300" height="285" rx="16" fill="#f8fafc" stroke="#0f172a" stroke-width="3.5"/><text x="580" y="130" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">rr_arbiter_fsm</text><text x="580" y="149" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">Moore FSM + turn register</text><rect x="455" y="165" width="120" height="58" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/><text x="515" y="192" text-anchor="middle" font-size="16" font-weight="700" fill="#475569" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">IDLE</text><text x="515" y="211" text-anchor="middle" font-size="12" font-weight="400" fill="#475569" font-family="Consolas, Menlo, monospace">s = 00</text><rect x="585" y="165" width="120" height="58" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="645" y="192" text-anchor="middle" font-size="16" font-weight="700" fill="#2563eb" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">g1</text><text x="645" y="211" text-anchor="middle" font-size="12" font-weight="400" fill="#475569" font-family="Consolas, Menlo, monospace">s = 01</text><rect x="455" y="235" width="120" height="58" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="515" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">g2</text><text x="515" y="281" text-anchor="middle" font-size="12" font-weight="400" fill="#475569" font-family="Consolas, Menlo, monospace">s = 10</text><rect x="585" y="235" width="120" height="58" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/><text x="645" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#ea580c" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">g3</text><text x="645" y="281" text-anchor="middle" font-size="12" font-weight="400" fill="#475569" font-family="Consolas, Menlo, monospace">s = 11</text><rect x="455" y="305" width="250" height="56" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="580" y="329" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">turn register (2-bit)</text><text x="580" y="349" text-anchor="middle" font-size="12" font-weight="400" fill="#6d28d9" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">who IDLE checks first</text><line x1="500" y1="83" x2="500" y2="100" stroke="#111827" stroke-width="3" marker-end="url(#bk)"/><line x1="660" y1="83" x2="660" y2="100" stroke="#111827" stroke-width="3" marker-end="url(#bk)"/><text x="500" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#111827" font-family="Consolas, Menlo, monospace">clk</text><text x="660" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#111827" font-family="Consolas, Menlo, monospace">rst</text><rect x="910" y="100" width="150" height="285" rx="16" fill="#f1f5f9" stroke="#475569" stroke-width="3"/><text x="985" y="235" text-anchor="middle" font-size="18" font-weight="700" fill="#334155" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">Shared</text><text x="985" y="258" text-anchor="middle" font-size="18" font-weight="700" fill="#334155" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">Resource</text><text x="985" y="285" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">bus / memory /</text><text x="985" y="302" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">peripheral</text><text x="550" y="430" text-anchor="middle" font-size="14" font-weight="400" fill="#334155" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">Exactly one gnt bit is high at a time (mutual exclusion). All three gnt bits are low in IDLE.</text><text x="550" y="452" text-anchor="middle" font-size="14" font-weight="400" fill="#334155" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">A master keeps the grant while req stays high; releasing it sends the FSM through IDLE and advances turn.</text></svg>